<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="t d">
  <title id="t">Hossein Gorji — Full-Stack Developer, Applied AI</title>
  <desc id="d">Computer Science (Honours) at York University, Co-op Program, Toronto. Open to co-op and internship roles in 2027. A terminal shows an agent generating code, failing tests, diagnosing, and passing on the second attempt.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#eef4ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#8c959f"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#fff" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.35"/>
    </linearGradient>
    <mask id="dotmask"><rect width="1000" height="300" fill="url(#fade)"/></mask>
    <clipPath id="card"><rect x="1" y="1" width="998" height="298" rx="16"/></clipPath>
  </defs>
  <style>
    .name{font:700 52px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#1f2328;letter-spacing:-1.2px}
    .eyebrow{font:600 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#2563eb;letter-spacing:2.6px}
    .sub{font:400 17px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif;fill:#59636e}
    .sub b{fill:#1f2328;font-weight:600}
    .pill{font:500 12.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#1f2328}
    .ttl{font:500 11.5px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#8b949e}
    .l{font:400 14px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace;fill:#e6edf3;white-space:pre}
    .cur{fill:#e6edf3;animation:cur 12.0s steps(1) infinite}
    .pulse{transform-origin:66px 242px;animation:pulse 2.4s ease-out infinite}
    @keyframes pulse{0%{opacity:.55;transform:scale(1)}100%{opacity:0;transform:scale(2.6)}}
    @keyframes cur{0%,4.58%{opacity:1}4.59%,9.17%{opacity:0}9.18%,18.33%{opacity:1}18.34%,76.33%{opacity:0}76.34%,80.33%{opacity:1}80.34%,84.33%{opacity:0}84.34%,100%{opacity:1}}
    @keyframes l0{0%,18.33%{opacity:1;transform:none}22.08%,25.83%{opacity:0;transform:translateX(-6px)}28.33%,100%{opacity:1;transform:none}}.l0{animation:l0 12.0s ease-out infinite}@keyframes l1{0%,18.33%{opacity:1;transform:none}22.08%,33.75%{opacity:0;transform:translateX(-6px)}36.25%,100%{opacity:1;transform:none}}.l1{animation:l1 12.0s ease-out infinite}@keyframes l2{0%,18.33%{opacity:1;transform:none}22.08%,41.67%{opacity:0;transform:translateX(-6px)}44.17%,100%{opacity:1;transform:none}}.l2{animation:l2 12.0s ease-out infinite}@keyframes l3{0%,18.33%{opacity:1;transform:none}22.08%,49.58%{opacity:0;transform:translateX(-6px)}52.08%,100%{opacity:1;transform:none}}.l3{animation:l3 12.0s ease-out infinite}@keyframes l4{0%,18.33%{opacity:1;transform:none}22.08%,57.5%{opacity:0;transform:translateX(-6px)}60.0%,100%{opacity:1;transform:none}}.l4{animation:l4 12.0s ease-out infinite}@keyframes l5{0%,18.33%{opacity:1;transform:none}22.08%,65.42%{opacity:0;transform:translateX(-6px)}67.92%,100%{opacity:1;transform:none}}.l5{animation:l5 12.0s ease-out infinite}@keyframes l6{0%,18.33%{opacity:1;transform:none}22.08%,73.33%{opacity:0;transform:translateX(-6px)}75.83%,100%{opacity:1;transform:none}}.l6{animation:l6 12.0s ease-out infinite}
    @media (prefers-reduced-motion: reduce){
      .l,.cur{animation:none;opacity:1} .pulse{animation:none;opacity:0}
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#bg)"/>
    <rect width="1000" height="300" fill="url(#dots)" opacity="0.28" mask="url(#dotmask)"/>
    <ellipse cx="750.0" cy="150.0" rx="340" ry="190" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="16" fill="none" stroke="#d0d7de"/>

  <!-- identity -->
  <text class="eyebrow" x="48" y="80">FULL-STACK DEVELOPER · APPLIED AI</text>
  <text class="name" x="46" y="138">Hossein Gorji</text>
  <text class="sub" x="48" y="176"><tspan font-weight="600" fill="#1f2328">Computer Science (Honours)</tspan> · York University</text>
  <text class="sub" x="48" y="202">Co-op Program · Toronto, ON</text>

  <rect x="48" y="226" width="300" height="32" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
  <circle class="pulse" cx="66" cy="242" r="5" fill="#1a7f37"/>
  <circle cx="66" cy="242" r="4.5" fill="#1a7f37"/>
  <text class="pill" x="80" y="246.5">open to co-op &amp; internship · 2027</text>

  <!-- terminal -->
  <rect x="536" y="34" width="428" height="232" rx="11" fill="#010409" stroke="#30363d"/>
  <path d="M536 45a11 11 0 0 1 11-11h406a11 11 0 0 1 11 11v19h-428z" fill="#161b22"/>
  <line x1="536" y1="64" x2="964" y2="64" stroke="#30363d"/>
  <circle cx="554" cy="49" r="5" fill="#ff5f57"/>
  <circle cx="571" cy="49" r="5" fill="#febc2e"/>
  <circle cx="588" cy="49" r="5" fill="#28c840"/>
  <text class="ttl" x="750.0" y="53" text-anchor="middle">executo — verify loop</text>
    <text class="l l0" x="558" y="94"><tspan fill="#58a6ff">$</tspan> executo <tspan fill="#8b949e">"slugify a blog title"</tspan></text>
  <text class="l l1" x="558" y="117"><tspan fill="#79c0ff">→ generate</tspan>  code + unit tests</text>
  <text class="l l2" x="558" y="140"><tspan fill="#79c0ff">→ sandbox </tspan>  docker · network off</text>
  <text class="l l3" x="558" y="163"><tspan fill="#79c0ff">→ run     </tspan>  4/6 passed  <tspan fill="#ff7b72">✗</tspan></text>
  <text class="l l4" x="558" y="186"><tspan fill="#79c0ff">→ diagnose</tspan>  read trace · patch</text>
  <text class="l l5" x="558" y="209"><tspan fill="#79c0ff">→ run     </tspan>  6/6 passed  <tspan fill="#56d364">✓</tspan></text>
  <text class="l l6" x="558" y="232"><tspan fill="#56d364">✓ accepted</tspan> <tspan fill="#8b949e">· attempt 2 of 4</tspan></text>
  <rect class="cur" x="808" y="219" width="8" height="16" rx="1"/>
</svg>
